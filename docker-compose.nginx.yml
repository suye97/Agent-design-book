# 可选：在 docker compose 里附带 nginx 反向代理
#
# ⚠️ 如果宿主机 80/443 已有 nginx（本项目实测 <YOUR_DOMAIN> 的服务器就是如此），
#    不要启动这个文件，会端口冲突；请用宿主机 nginx + deploy/nginx.domain.conf。
#
# 用法（宿主机没有 nginx 时）：
#   mkdir -p deploy/certs
#   docker compose -f docker-compose.yml -f docker-compose.nginx.yml up -d --build
#
# 说明：nginx.conf 里的 upstream 是 app:8000（compose 网络内解析）。
# TLS 证书放到 ./deploy/certs/{fullchain.pem,privkey.pem} 后启用 443 配置块。

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: agent-design-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
