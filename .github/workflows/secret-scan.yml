name: secret-scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 扫描敏感信息（API key / 公网 IP / 域名 / 凭据 / 私钥）
        run: python scripts/check_secrets.py --all
