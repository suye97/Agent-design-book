# 「Agent 设计」问答 Agent —— nginx 反向代理（通用模板）
# 已有 <YOUR_DOMAIN> 域名：直接用 deploy/nginx.domain.conf（复用现有证书）
# 场景 A（docker compose）：upstream 用 app:8000
# 场景 B（宿主机 nginx）：把 upstream 改成 127.0.0.1:8000
# 证书就绪后：把 80 端口 server 改成 301 跳转，并启用下方 443 server 块

upstream agent_design_app {
    server app:8000;
    keepalive 16;
}

# ---------- HTTP ----------
server {
    listen 80;
    server_name _;                      # 改成你的域名，例如 qa.example.com

    # 证书就绪后启用：
    # return 301 https://$host$request_uri;

    client_max_body_size 2m;

    # 安全响应头（按需调整）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- SSE 流式接口：必须关闭缓冲，否则前端收不到 token ----
    location = /api/chat/stream {
        proxy_pass http://agent_design_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    # ---- 后台入库接口：默认不对外暴露（应用层还有 ADMIN_API_KEY） ----
    location /api/admin/ {
        # 需要远程触发入库时改为：allow <你的出口 IP>; deny all;
        deny all;
    }

    # ---- 其余接口与前端 ----
    location / {
        proxy_pass http://agent_design_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;      # 问答是同步接口，推理模型可能 10~20s
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # 健康检查不写访问日志，方便云监控轮询
    location = /api/health {
        access_log off;
        proxy_pass http://agent_design_app;
        proxy_set_header Host $host;
    }
}

