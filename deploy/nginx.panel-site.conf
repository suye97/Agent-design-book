# 「Agent 设计」问答 Agent —— 堡垒面板（宿主机 nginx）站点配置模板
#
# 适用：nginx 由面板管理（不是 Docker 里的 nginx），项目统一放在 /data/projects。
# 用法：面板 → 网站 → 添加站点（或编辑现有站点）→ 配置修改 → 粘贴本文件内容 → 保存。
#
# 推荐用子域名（agent.<YOUR_DOMAIN>），不动现有 <YOUR_DOMAIN> 站点（它已配置了 3x-ui 等 location）。
# 若坚持用根域名，把 server_name 改成 <YOUR_DOMAIN> 并确认现有首页内容可以替换。
#
# 改完先校验：nginx -t（或面板“配置文件”里保存时自动校验），失败不要 reload。

server {
    listen 443 ssl;
    # listen [::]:443 ssl;
    # HTTP/2：面板 nginx 1.25+ 用下面一行；1.24 及更早用 listen 443 ssl http2;
    # http2 on;

    server_name agent.<YOUR_DOMAIN>;          # ← 改成你的域名（或 <YOUR_DOMAIN>）

    # 证书：面板申请证书后通常给出相对文件名，保持与现有站点一致的写法即可
    ssl_certificate     agent.<YOUR_DOMAIN>_bundle.crt;
    ssl_certificate_key agent.<YOUR_DOMAIN>.key;
    ssl_session_timeout 5m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    access_log off;

    # 前端静态文件：直接由 nginx 托管（无构建步骤）
    root /data/projects/agent-design-book/web;
    index index.html;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- SSE 流式问答：必须关缓冲，且要放在 /api/ 之前 ----
    location = /api/chat/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    # ---- 后台入库接口：公网关闭；需要时放开 allow <出口IP>; deny all; ----
    location /api/admin/ {
        deny all;
    }

    # ---- API 反向代理到本机 uvicorn ----
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;      # 推理模型单轮可能 10~20s
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ---- 前端静态页 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查走 API，不单独写访问日志
    location = /api/health {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}

# 80 端口：如果面板已经把 80 自动跳转到 443，可忽略本段；
# 否则在面板站点里加：
# server {
#     listen 80;
#     server_name agent.<YOUR_DOMAIN>;
#     return 301 https://$host$request_uri;
# }
