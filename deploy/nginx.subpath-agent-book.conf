# 「Agent 设计」问答 Agent —— 挂载在根域名的子路径 /agent-book/
# 访问地址：https://<YOUR_DOMAIN>/agent-book/
#
# 适用：nginx 由堡垒面板管理，<YOUR_DOMAIN> 站点已存在（root /data/projects/html、含 /xui-panel/ 等）。
# 用法：面板 → 网站 → <YOUR_DOMAIN> → 配置文件 → 把下面「粘贴片段」整段加进现有 443 的 server { } 内
#      （不用替换原有 root / location，互不影响）→ 保存。
#
# 目录要求：
#   /data/projects/agent-design-book/web           前端静态文件（nginx 只读）
#   /data/projects/agent-design-book/data/chunks.jsonl
# 应用监听：127.0.0.1:8000

# ============================ 粘贴片段（start） ============================

# 1) 去掉末尾斜杠时补齐，否则浏览器解析相对 API 路径会错位
location = /agent-book {
    return 301 /agent-book/;
}

# 2) SSE 流式接口：必须关闭缓冲（放在 /agent-book/api/ 之前，精确匹配优先）
location = /agent-book/api/chat/stream {
    proxy_pass http://127.0.0.1:8000/api/chat/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    add_header X-Accel-Buffering no;
}

# 3) 后台入库接口：公网关闭（应用层还有 ADMIN_API_KEY）
location ^~ /agent-book/api/admin/ {
    deny all;
}

# 4) API：剥离 /agent-book 前缀后转发到后端的 /api/...
#    注意 proxy_pass 末尾必须带 / ，它负责把 /agent-book/api/xxx 重写成 /api/xxx
location /agent-book/api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;      # 推理模型单轮可能 10~20s
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
}

# 5) 前端静态文件（index.html / app.js / styles.css，路径均为相对路径）
#    alias 末尾的 / 不能省；本页没有前端路由，不需要 try_files。
location /agent-book/ {
    alias /data/projects/agent-design-book/web/;
    index index.html;
    # 静态资源可加缓存（可选）
    # expires 1h;
}

# ============================ 粘贴片段（end） ============================


