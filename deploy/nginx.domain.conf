# 「Agent 设计」问答 Agent —— 绑定 <YOUR_DOMAIN> 的 nginx 配置（整站反代版）
# ⚠️ 如果 nginx 由堡垒面板管理（本项目实际环境），请优先用 deploy/nginx.panel-site.conf：
#    root 指向项目的 web/，只把 /api/ 反代到 127.0.0.1:8000，不动现有站点。
# 本文件适用于“独立 nginx / 无面板”的场景，整站反代到应用。
# 用法：
#   1) 先确认没有同名 server 块：sudo nginx -T | grep -n "server_name <YOUR_DOMAIN>"
#      如果有旧的，先注释/删除，否则会报 conflicting server name，且旧块优先。
#   2) 查现有证书路径：sudo nginx -T | grep -E "ssl_certificate|ssl_certificate_key"
#      把下面两行替换成实际路径（腾讯云/宝塔/letsencrypt 各不同）。
#   3) sudo cp deploy/nginx.domain.conf /etc/nginx/conf.d/agent-design.conf
#   4) sudo nginx -t && sudo systemctl reload nginx

upstream agent_design_app {
    server 127.0.0.1:8000;      # compose 内 nginx 则改为 app:8000
    keepalive 16;
}

# ---------- HTTP：ACME 校验 + 强制 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name <YOUR_DOMAIN> www.<YOUR_DOMAIN>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：前端 + API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name <YOUR_DOMAIN> www.<YOUR_DOMAIN>;

    # ↓↓↓ 换成服务器上实际证书路径（见文件头第 2 步）↓↓↓
    ssl_certificate     /etc/nginx/ssl/<YOUR_DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/ssl/<YOUR_DOMAIN>.key;
    # TrustAsia 证书通常还会带中间证书，若是拼接文件，fullchain 形式即可

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- SSE 流式接口：必须关缓冲，否则前端看不到逐字输出 ----
    location = /api/chat/stream {
        proxy_pass http://agent_design_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering no;
    }

    # ---- 后台入库接口：公网默认关闭（应用层还有 ADMIN_API_KEY） ----
    location /api/admin/ {
        # 需要远程触发入库时：allow <你的出口IP>; deny all;
        deny all;
    }

    # ---- 健康检查：不写访问日志，方便监控轮询 ----
    location = /api/health {
        access_log off;
        proxy_pass http://agent_design_app;
        proxy_set_header Host $host;
    }

    # ---- 前端静态页 + 其余 API（同源，前端不需要任何环境变量） ----
    location / {
        proxy_pass http://agent_design_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# ---------- 可选：用子域名（如 agent.<YOUR_DOMAIN>）隔离 ----------
# 需要：1) DNS 加 A 记录 agent -> <SERVER_IP>
#       2) 单独申请证书：sudo certbot --nginx -d agent.<YOUR_DOMAIN>
#       3) 把上面的 server 块复制一份，server_name 改成 agent.<YOUR_DOMAIN>，
#          证书路径改成 /etc/letsencrypt/live/agent.<YOUR_DOMAIN>/...
# server {
#     listen 80;
#     server_name agent.<YOUR_DOMAIN>;
#     return 301 https://$host$request_uri;
# }
